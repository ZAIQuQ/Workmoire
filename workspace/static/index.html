<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d1726">
  <title>Workmoire · 拾序</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <section id="auth-view" class="auth-view is-hidden">
    <div class="auth-orbit orbit-a"></div><div class="auth-orbit orbit-b"></div>
    <div class="auth-card">
      <div class="mark mark-large">W</div>
      <div class="eyebrow">PRIVATE WORKSPACE</div>
      <h1 id="auth-title">欢迎回来</h1>
      <p id="auth-subtitle">把论文、项目和日常思路放在同一个安静的空间里。</p>
      <form id="auth-form" autocomplete="on">
        <label class="form-field"><span>账号</span><input id="auth-username" autocomplete="username" required></label>
        <label class="form-field"><span>密码</span><input id="auth-password" type="password" autocomplete="current-password" required></label>
        <label id="auth-confirm-row" class="form-field is-hidden"><span>确认密码</span><input id="auth-confirm" type="password" autocomplete="new-password"></label>
        <label id="auth-setup-token-row" class="form-field is-hidden"><span>初始化令牌</span><input id="auth-setup-token" type="password" autocomplete="one-time-code"></label>
        <button id="auth-submit" class="button button-primary button-block" type="submit">登录</button>
        <p id="auth-error" class="form-error" role="alert"></p>
      </form>
      <p class="auth-foot">仅允许一个账号访问 · 数据保存在当前服务器</p>
    </div>
  </section>

  <div id="app-view" class="app-shell is-hidden">
    <aside class="sidebar">
      <div class="brand"><div class="mark">W</div><div><strong>Workmoire</strong><span>论文 · 项目 · 思路</span></div></div>
      <nav class="main-nav" aria-label="主导航">
        <button class="nav-item is-active" data-page="dashboard"><span class="nav-icon">⌂</span>总览</button>
        <button class="nav-item" data-page="review"><span class="nav-icon">✦</span>今日复盘</button>
        <div class="nav-label">整理空间</div>
        <button class="nav-item" data-page="note"><span class="nav-icon">▤</span>知识库</button>
        <button class="nav-item" data-page="project"><span class="nav-icon">◈</span>项目空间</button>
        <button class="nav-item" data-page="paper"><span class="nav-icon">▧</span>论文大纲</button>
        <button class="nav-item" data-page="log"><span class="nav-icon">◷</span>工作日志</button>
        <div class="nav-label">资源</div>
        <button class="nav-item" data-page="files"><span class="nav-icon">⌁</span>文件空间</button>
        <button class="nav-item" data-page="trash"><span class="nav-icon">♲</span>回收站</button>
      </nav>
      <div class="sidebar-bottom">
        <button id="settings-button" class="account-button"><span class="avatar">U</span><span id="account-name">个人账号</span><span class="dots">···</span></button>
        <div id="settings-menu" class="settings-menu is-hidden"><button id="export-data">导出知识库</button><button id="import-data">导入知识库</button><button id="change-password">修改密码</button><button id="logout">退出登录</button></div>
        <div class="server-status"><i></i><span id="server-status-label">本地服务在线</span></div>
      </div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <div class="mobile-brand"><div class="mark">W</div><strong>Workmoire</strong></div>
        <div class="breadcrumbs"><span>拾序工作空间</span><b>/</b><strong id="page-heading">总览</strong></div>
        <div class="top-actions"><button id="global-search-trigger" class="search-trigger"><span>⌕</span><span>搜索内容</span><kbd>Ctrl K</kbd></button><button id="mobile-menu" class="icon-button" aria-label="打开菜单">☰</button></div>
      </header>
      <div id="page-content" class="page-content"></div>
    </main>
  </div>

  <dialog id="password-dialog" class="dialog"><form method="dialog" id="password-form" class="dialog-card"><div class="dialog-head"><h2>修改密码</h2><button class="icon-button" value="cancel" aria-label="关闭">×</button></div><label class="form-field"><span>当前密码</span><input id="old-password" type="password" required></label><label class="form-field"><span>新密码</span><input id="new-password" type="password" minlength="10" required></label><p id="password-message" class="form-error"></p><div class="dialog-actions"><button class="button button-secondary" value="cancel">取消</button><button id="password-submit" class="button button-primary" value="default">更新密码</button></div></form></dialog>
  <dialog id="capture-dialog" class="dialog"><form method="dialog" id="capture-form" class="dialog-card capture-dialog-card"><div class="dialog-head"><div><h2>快速捕捉</h2><p class="dialog-subtitle">先放进待整理箱，之后再慢慢组织。</p></div><button class="icon-button" value="cancel" aria-label="关闭">×</button></div><div id="capture-draft-notice" class="capture-draft-notice is-hidden">发现本机未提交的捕捉：<button id="restore-capture-draft" type="button">恢复</button><button id="discard-capture-draft" type="button">清除</button></div><label class="form-field"><span>标题</span><input id="capture-title" maxlength="200" placeholder="刚刚想到什么？" required></label><label class="form-field"><span>内容（可选）</span><textarea id="capture-content" rows="7" placeholder="先写下关键词、问题或下一步……"></textarea></label><p id="capture-error" class="form-error" role="alert"></p><div class="dialog-actions"><span class="capture-shortcut">Ctrl/⌘ + Shift + N</span><button class="button button-secondary" value="cancel">取消</button><button id="capture-submit" class="button button-primary" value="default">放入待整理箱</button></div></form></dialog>
  <dialog id="search-dialog" class="dialog"><div class="dialog-card search-dialog-card"><div class="search-box"><span>⌕</span><input id="global-search" placeholder="搜索标题、摘要、标签和正文…" autocomplete="off"><kbd>ESC</kbd></div><div id="search-results" class="search-results"><div class="search-empty">输入关键词开始搜索</div></div></div></dialog>
  <dialog id="assistant-dialog" class="dialog"><div class="dialog-card assistant-dialog-card"><div class="dialog-head"><h2>本地整理助手</h2><button id="assistant-close" class="icon-button" aria-label="关闭">×</button></div><p class="assistant-note">内容只会发送给服务器上显式配置的本地 Codex，不会写入数据库。生成结果不会自动修改内容。</p><label class="form-field"><span>整理方式</span><select id="assistant-task"><option value="summarize">提炼摘要</option><option value="outline">整理大纲</option><option value="next_steps">生成下一步</option><option value="review">检查结构</option></select></label><pre id="assistant-result" class="assistant-result">选择任务后开始整理。</pre><div class="dialog-actions assistant-apply-actions"><button id="assistant-apply-summary" class="button button-secondary is-hidden">填入摘要</button><button id="assistant-apply-content" class="button button-secondary is-hidden">追加到正文</button><span class="spacer"></span><button id="assistant-run" class="button button-primary">开始整理</button></div></div></dialog>
  <input id="import-input" class="file-input" type="file" accept="application/json,.json">
  <script src="/static/app.js"></script>
</body>
</html>
