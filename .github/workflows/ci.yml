name: quality

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Verify source boundaries and generated assets
        run: |
          python3 scripts/check_public_source.py
          npm run build
          git diff --exit-code -- workspace/static
          git diff --check
      - name: Compile and run backend and command tests
        run: |
          make compile
          make test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Retain synthetic browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-diagnostics
          path: artifacts/browser-results/
          retention-days: 7
