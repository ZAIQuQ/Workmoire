name: quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Source and backend
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: make preflight

  browser:
    name: Browser (${{ matrix.suite }})
    runs-on: ubuntu-24.04
    container:
      # Keep the preinstalled browser matched to package-lock.json.
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      options: --ipc=host
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: workspace
            filter: '--grep-invert @background-autosave'
          - suite: autosave
            filter: '--grep @background-autosave'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:browser -- ${{ matrix.filter }}
      - name: Retain synthetic browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: browser-diagnostics-${{ matrix.suite }}
          path: artifacts/browser-results/
          retention-days: 7
